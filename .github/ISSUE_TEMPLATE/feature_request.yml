name: Feature request
description: Propose a scoped improvement aligned with the approved project goals.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Primary user
      options:
        - Resident
        - Council staff
        - Administrator
        - Developer or operator
        - Multiple roles
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      placeholder: |
        - Given ... when ... then ...
  - type: textarea
    id: impact
    attributes:
      label: Privacy, security, and accessibility impact
      description: Identify new information, permissions, integrations, risks, or interface needs.
    validations:
      required: true
