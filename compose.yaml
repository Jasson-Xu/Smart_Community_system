services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartcommunity
      POSTGRES_USER: smartcommunity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcommunity -d smartcommunity"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
